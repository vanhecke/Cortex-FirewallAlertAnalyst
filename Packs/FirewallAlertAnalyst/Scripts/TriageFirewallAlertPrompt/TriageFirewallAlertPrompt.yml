commonfields:
  id: TriageFirewallAlertPrompt
  version: -1
name: TriageFirewallAlertPrompt
comment: >-
  Prompt-backed (isllm) triage step for the Firewall Alert Analyst agent. Takes a scored
  alert plus its surrounding traffic and writes the analyst verdict: benign, suspicious or
  malicious, with the evidence behind it. There is no Python here - the judgment is the
  model's, and the reproducible half of triage lives in ScoreFirewallAlertScript.
type: python
isllm: true
userprompt: |-
  Alert under triage:

  ${alert}

  Deterministic score breakdown from Score Firewall Alert:

  ${score_breakdown}

  Surrounding traffic from the same source (may be empty):

  ${context_traffic}

  Answer with exactly these four sections:

  1. VERDICT - benign, suspicious or malicious, and your confidence as high, medium or low.
  2. EVIDENCE - the specific fields and traffic that drove the verdict. Quote values. If
     the deterministic score disagrees with your read, say which you trust and why.
  3. BLAST RADIUS - which other hosts or users this source touched in the traffic you were
     given. Write "none in the provided window" rather than guessing.
  4. NEXT QUERY - the single most useful follow-up question, phrased so it can be run
     against firewall logs. If the evidence already settles it, write "none needed".

  Do not recommend blocking or any other containment action. That is the analyst's call.
# The platform picks the model from modelTier alone. Upload drops a top-level model and
# systemprompt, and promptConfig.model is stored but ignored (tested live), so modelTier
# and systemInstruction are the only way to set either. The tenant decides which model
# backs each tier: /api/v1/agentix/hub-models.
promptConfig:
  modelTier: Pro
  systemInstruction: >-
    You are a firewall alert triage analyst. You reason only from the alert, the score
    breakdown and the surrounding traffic you are given. You never assert that an address,
    port or signature is malicious without evidence in that input, and you never invent a
    threat name. A high score is a prompt to look, not a verdict. When the evidence does not
    settle the question you say so and name the one query that would.
  maxOutputTokens: 4096
  webSearch: false
args:
  - name: alert
    description: The alert under triage, as JSON.
    required: true
  - name: score_breakdown
    description: The score, band and reasons returned by Score Firewall Alert.
    required: true
  - name: context_traffic
    description: Other recent records from the same source. Optional.
    required: false
# Exactly one output. The platform rejects a prompt with none: "'Outputs' attribute must
# have 1 value (52)". The prompt answers in four prose sections, so the single output is
# that answer.
outputs:
  - contextPath: FirewallAlert.Triage.verdict
    description: The triage answer - VERDICT, EVIDENCE, BLAST RADIUS and NEXT QUERY.
    type: String
fromversion: 8.15.0
tags: []
marketplaces:
  - platform
