commonfields:
  id: firewall-alert-analyst-agent
  version: -1
display: Firewall Alert Analyst
name: Firewall Alert Analyst
tags:
  - firewall
  - triage
category: Analytics & SIEM
description: Triages a firewall alert end to end - scores it deterministically, pulls the surrounding traffic, judges it against the evidence and records one verdict. It never recommends containment.
color: "#D64550"
visibility: public
systeminstructions: ""
conversationstarters:
  - "Triage this firewall alert: deny, src 203.0.113.10, dst port 3389, 3 prior hits"
  - "What else did 203.0.113.10 touch in the last 24 hours?"
  - "Score this alert and tell me whether it is worth escalating"
actionids:
  - ScoreFirewallAlertAction
  - GetCaseDetailsAction
  - SearchFirewallLogsAction
  - GetFirewallSearchResultsAction
  - TriageFirewallAlertAction
  - DraftEscalationNoteAction
  - BlockIpAction
  # MCP tools. These actions are NOT in this pack and cannot be - the server type is
  # "MCP Tool", which GR110 rejects. They are generated by the platform when a Generic MCP
  # instance is configured, and their ids are deterministic:
  #   mcp_<IntegrationId>_<InstanceName>_<toolName>, spaces replaced by underscores.
  # Listing them here tests whether a pack agent can bind to platform-generated actions.
  # They resolve only on a tenant with an instance named exactly "Cortex Docs MCP".
  - mcp_Generic_MCP_Cortex_Docs_MCP_searchDocumentation
  - mcp_Generic_MCP_Cortex_Docs_MCP_askQuestion
builtinactions:
  # InvokeLLM is on 11 of the 14 agents this tenant ships, and is the only builtin the
  # PANW agents share. A prompt-backed (isllm) action appears to need it.
  - InvokeLLM
  - CortexRunXQLQuery
skillids:
  - firewall-alert-triage-skill
collectionids:
  - FirewallTriageWorkedAlertsCollection
autoenablenewactions: false
roles:
  - Analyst
sharedwithroles:
  - Analyst
  - Investigator
marketplaces:
  - platform
supportedModules:
  - agentix
