# demisto-sdk validate config for this project's single pack.
#
# Why this file exists: the SDK's own default_config.toml selects 15 codes and NOT
# ONE agentix rule, so `validate` never checked our agents, actions, skills or
# collections. Its other config, sdk_validation_config.toml, does select the AG
# rules but is written for a checkout of demisto/content — it pulls in PA102-style
# validators that fetch approved_categories.json / approved_usecases.json and abort
# with "you may not be running validate from the content directory".
#
# So: the SDK's 15 defaults, plus the agentix rules that work on a standalone pack, plus
# ST110, the strict-schema check. Without ST110 an unknown field passes silently: the
# demisto-sdk 1.39.13 rename of collectionids to knowledgeids went unnoticed until it was
# selected. ST110 is listed as ignorable for one reason only: TriageFirewallAlertPrompt
# sets promptConfig.systemInstruction, which the server honours but the strict
# PromptConfig model does not list. Its .pack-ignore entry is the only ST110 exception.
#
# Targets demisto-sdk 1.39.13.
#
# Deliberately NOT selected:
#   AG100  forbidden-content list, resolved against the remote content repo
#   AG102  category checked against approved_categories.json, fetched from remote
#   AG112  action/skill char budget — the embedded xdm-author skill body is ~366k
#          against an 8000 limit. Kept ignorable so it can be re-enabled per file.
#   AG116  agent skill/action dependency check — needs the content graph
#   GR1xx  every graph validator — needs the content graph
#   DO104  in the SDK's default 15, but it resolves docker tags against Docker Hub
#          unauthenticated. A prompt-backed (isllm) script has no container, so the
#          SDK falls back to demisto/python2 and the whole run dies on a 401 —
#          it raises rather than failing the item.
ignorable_errors = [
  "AG112",
  "ST110",
  "DO104",
  "AG117",
  "BA101",
  "BA105",
  "BA106",
  "BA116",
  "BA118",
  "IN108",
  "IN130",
  "PA107",
  "PA108",
  "PA111",
  "PA115",
  "PA128",
  "PA130",
  "RP101"
]

